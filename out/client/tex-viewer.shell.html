<!-- tex-viewer.shell.html — the Page view's markup and styling.
     Kept OUT of texViewer.js on purpose: the headless harness
     (Experiments/wolfbook-tex/e-viewer/check-panel.mjs) serves this exact
     file, so what is measured is what ships. A second copy of a viewer has
     already cost this project once — see the 3D note in CLAUDE.md. -->
<style>
  :root { color-scheme: light dark; }
  body { margin:0; font-family: var(--vscode-font-family); font-size: 12px;
         background: var(--vscode-editor-background); color: var(--vscode-foreground);
         display:flex; flex-direction:column; height:100vh; }

  /* --- toolbar --- */
  header { display:flex; align-items:center; gap:8px; padding:5px 10px;
           background: var(--vscode-editorWidget-background, var(--vscode-editor-background));
           border-bottom:1px solid var(--vscode-panel-border); flex:0 0 auto;
           user-select:none; white-space:nowrap; overflow:hidden; }
  header button { display:inline-flex; align-items:center; justify-content:center;
           min-width:26px; height:24px; padding:0 8px; border:none; border-radius:4px;
           background:transparent; color: var(--vscode-foreground);
           cursor:pointer; font-size:12px; line-height:1; }
  .icon-sprite { position:absolute; width:0; height:0; overflow:hidden; }
  .tool-icon { width:15px; height:15px; flex:0 0 auto; fill:none;
           stroke:currentColor; stroke-width:1.55; stroke-linecap:round;
           stroke-linejoin:round; vector-effect:non-scaling-stroke; }
  .tool-icon.fill { fill:currentColor; stroke:none; }
  .tool-icon + .tlbl { margin-left:4px; }
  header .icon-only { padding:0 5px; }
  header button:hover { background: var(--vscode-toolbar-hoverBackground, rgba(128,128,128,.18)); }
  header button:focus-visible, label.follow:has(input:focus-visible),
  .comment-marker:focus-visible, #commentpanel button:focus-visible {
           outline:1px solid var(--vscode-focusBorder, #007fd4); outline-offset:1px; }
  header button:active { transform: translateY(0.5px); }
  #recompile { background: var(--vscode-button-background);
           color: var(--vscode-button-foreground); font-weight:500; }
  #recompile:hover { background: var(--vscode-button-hoverBackground); }
  .zoomgroup { display:inline-flex; align-items:center;
           border:1px solid var(--vscode-panel-border); border-radius:4px; }
  .zoomgroup button { min-width:24px; padding:0 6px; border-radius:3px; }
  #zoom { min-width:42px; text-align:center; opacity:.85; font-size:11px;
          font-variant-numeric: tabular-nums; }
  /* Responsive Fit is a MODE, so it must remain visibly selected after the
     pointer leaves. VS Code's secondary-button colour is nearly identical to
     the dark toolbar in several themes; a focus tint + inset outline keeps
     both the icon and label unmistakably active without making it primary. */
  #fit[aria-pressed="true"] {
          background:color-mix(in srgb, var(--vscode-focusBorder, #0a84ff) 24%, transparent);
          color:var(--vscode-textLink-foreground, #4daafc);
          box-shadow:inset 0 0 0 1px var(--vscode-focusBorder, #0a84ff); }
  #fit[aria-pressed="true"]:hover {
          background:color-mix(in srgb, var(--vscode-focusBorder, #0a84ff) 34%, transparent); }
  label.follow { display:inline-flex; align-items:center; gap:5px; height:22px;
          padding:0 9px; border-radius:11px; cursor:pointer; opacity:.85;
          border:1px solid var(--vscode-panel-border); }
  label.follow:hover { opacity:1; }
  label.follow:has(input:checked) {
          background: var(--vscode-badge-background); color: var(--vscode-badge-foreground);
          border-color: transparent; opacity:1; }
  label.follow input { position:absolute; opacity:0; pointer-events:none; width:0; height:0; }
  #where { margin-left:auto; opacity:.8; font-variant-numeric: tabular-nums;
           overflow:hidden; text-overflow:ellipsis; }
  .pp { opacity:.5; font-variant-numeric: tabular-nums; }

  /* --- pages --- */
  #reader { flex:1 1 auto; min-height:0; display:flex; position:relative; overflow:hidden; }
  main { flex:1 1 auto; min-width:0; overflow:auto; padding:20px 16px;
         scrollbar-gutter: stable;
         background: var(--vscode-editorPane-background, var(--vscode-editor-background)); }
  /* Fit means edge to edge: the horizontal padding would otherwise inset the
     page by 16px on each side, which is exactly the margin Fit is meant to
     remove. The page keeps its shadow, so the boundary is still visible. */
  body.fitted main { padding-left:0; padding-right:0; }
  body.fitted .page { border-radius:0; }
  body.fitted .page canvas { border-radius:0; }
  /* The strip, not the viewport, owns centering. `align-items:center` on a
     viewport-width flex column gives an oversized page a NEGATIVE left edge;
     scrollLeft can never become negative, so half the paper is unreachable.
     max-content lets the strip grow to its widest page, while min-width keeps
     ordinary pages centred in the available field. */
  #pages { display:flex; flex-direction:column; align-items:center; gap:18px;
           box-sizing:border-box; width:max-content; min-width:100%; }
  body.comments-open #pages { box-sizing:border-box; padding-right:42px; }
  /* At fitted width there is no outer paper margin to host a rail. Keep the
     page edge-to-edge and place annotation bubbles just inside its edge. */
  body.fitted.comments-open #pages { padding-right:0; }
  /* The PDF surface deliberately prevents the browser's default drag focus.
     Give it an explicit, invisible keyboard focus target so a click can hand
     subsequent typing and editing shortcuts to the paper. */
  #pages:focus { outline:none; }
  /* WHILE A ZOOM GESTURE IS RUNNING the canvases are stretched by CSS and the
     overlays are stale — they are placed in the pixels of the viewport the
     page was drawn at, so they would drift away from what they name. One rule
     rather than a list of classes, so a new overlay cannot be forgotten. */
  body.zooming #pages > .page > *:not(canvas):not(.pagenum):not(.mmacard):not(.editcard) { display: none !important; }
  body.zooming #pages > .page > canvas { image-rendering: auto; }
  .page { position:relative; background:#fff; border-radius:2px;
          box-shadow: 0 1px 3px rgba(0,0,0,.22), 0 4px 16px rgba(0,0,0,.22); }
  .page canvas { display:block; border-radius:2px; }

  /* DARK PAGES ARE A FILTER ON THE ELEMENT, NEVER A REWRITE OF THE PIXELS.
     `snapToInk` reads the canvas back with getImageData and calls anything
     below red 140 ink, on the assumption of black type on white paper. A CSS
     filter changes what is DISPLAYED and leaves the backing store exactly as
     pdf.js drew it, so word-precise highlighting keeps working here; inverting
     the pixels themselves would quietly invert that test instead.

     0.905 rather than a full invert: black type becomes #ededed on a #181818
     page rather than pure white on pure black, which is what the eye wants for
     a long read. hue-rotate puts coloured figures back near their own hue. */
  .wb-dark-pages .page { background:#181818;
          box-shadow: 0 1px 3px rgba(0,0,0,.5), 0 4px 18px rgba(0,0,0,.55); }
  .wb-dark-pages .page canvas { filter: invert(0.905) hue-rotate(180deg); }
  .wb-dark-pages .pagenum { opacity:.55; }
  #pagetheme { font-size:13px; }
  .pagenum { position:absolute; top:-16px; right:2px; font-size:10px; opacity:.45;
             font-variant-numeric: tabular-nums; }

  /* The highlight is a MARKER PEN, not a box.
     A red outline reads as an error and boxes the text in, which is exactly
     wrong for "here is where you are" — and around a single glyph in an
     equation a border is bigger than the thing it points at. A translucent
     wash sits behind the type, leaves it fully readable, and still shows the
     honesty flag: solid amber = fresh, hatched = only probably current, grey =
     stale. It then FADES, because a marker that never goes away competes with
     the text you are trying to read. */
  .hl { position:absolute; pointer-events:none; border-radius:2px;
        background:rgba(255,196,0,.40); mix-blend-mode:multiply;
        animation: hlfade 3s ease-out forwards; }
  .hl.approx { background:repeating-linear-gradient(45deg,
                 rgba(255,196,0,.40) 0 4px, rgba(255,196,0,.16) 4px 8px); }
  .hl.stale  { background:rgba(150,150,160,.34); }
  .hl.pinned { animation:none; }
  @keyframes hlfade { 0%,55% { opacity:1; } 100% { opacity:0; } }
  /* --- THE EDITOR'S CARET, INSIDE THE WORD -----------------------------
     The wash says WHICH word and then fades so it stops competing with the
     text. This says WHERE IN IT, and does not fade: the position is still
     true, and a text cursor that dimmed out would be lying about where you
     are. Red, because every other overlay here is amber/blue and a caret has
     to be findable at a glance on a dense page.
     Thickness is fixed in px rather than scaled with the page — a caret is a
     piece of UI, not part of the type, and a 2 px line that grew into a bar at
     400% zoom would cover the letter it is pointing between. */
  /* IT DOES NOT BLINK. A text cursor blinks because it has to be findable in a
     field you are typing into; this one sits on a PAGE you are reading, where
     the same motion is just something moving in the corner of your eye that you
     cannot ignore. Reported as distracting, and it was. A solid 2 px rule is
     perfectly findable and then stops asking for attention. */
  .curcaret { position:absolute; pointer-events:none; z-index:9;
              width:2px; margin-left:-1px; border-radius:1px;
              background:#e5484d; box-shadow:0 0 0 .5px rgba(255,255,255,.55); }
  .wb-dark-pages .curcaret { background:#ff6169; box-shadow:0 0 0 .5px rgba(0,0,0,.5); }
  /* A darkened page would swallow a multiply blend, so the wash goes on top
     instead. Keyed off the PAGE theme, not `prefers-color-scheme`: that is the
     operating system's preference, and a light VS Code theme on a dark desktop
     used to get the wrong one of these. */
  .wb-dark-pages .hl { mix-blend-mode: normal; background:rgba(255,196,0,.30); }
  .wb-dark-pages .hl.approx { background:repeating-linear-gradient(45deg,
                 rgba(255,196,0,.30) 0 4px, rgba(255,196,0,.10) 4px 8px); }
  .wb-dark-pages .hl.stale { background:rgba(170,170,180,.26); }
  /* --- A SELECTED FRAGMENT ---------------------------------------------
     Two solid marks and a wash between them. The marks are the precise part —
     they sit on the exact glyph the selection starts and ends at — so they are
     drawn at full strength; the fill only has to say "this much", and has to
     leave the type under it perfectly readable, so it is barely there.
     Red, and only this is red: nothing else in the page view uses it, so a
     selection can never be mistaken for the amber "where you are" marker. */
  .selfill { position:absolute; pointer-events:none; z-index:4;
             background: rgba(220,50,50,.10); }
  /* GRABBABLE, unlike everything else in the overlay: a bracket is a handle for
     resizing the selection, so it takes the pointer and says so. */
  .selbrk  { position:absolute; pointer-events:auto; cursor:col-resize; z-index:6; width:5px;
             border-top:2px solid rgba(210,40,40,.95);
             border-bottom:2px solid rgba(210,40,40,.95); }
  .selbrk.start { border-left:2px solid rgba(210,40,40,.95); margin-left:-2px; }
  .selbrk.end   { border-right:2px solid rgba(210,40,40,.95); margin-left:-3px; }
  /* Waiting for its other end: the same mark, breathing, so it is plainly a
     state and not a finished selection. */
  /* A wider invisible grip than the mark itself, or it is a 5 px target. */
  .selbrk::after { content:''; position:absolute; left:-6px; right:-6px; top:-3px; bottom:-3px; }
  .selbrk.pending { animation: selpulse 1.4s ease-in-out infinite; }
  @keyframes selpulse { 0%,100% { opacity:1; } 50% { opacity:.35; } }
  .wb-dark-pages .selfill { background: rgba(255,90,90,.14); }

  /* --- the comparison overlay ---
     A separate layer from .hl on purpose: paintHighlight removes every .hl on
     each cursor move, so a diff sharing that class would be wiped by the next
     keystroke. These persist until the comparison is closed.

     The COLOUR says what happened, the TREATMENT says how well we know where:
     a solid wash means the change is on those exact rows; a dotted outline
     means we could only place the enclosing object (most equation lines carry
     no SyncTeX record at all); a caret means inserted text, which has no
     position in this render by construction and must never be widened into a
     block that claims one. */
  .dh { position:absolute; pointer-events:none; border-radius:2px; z-index:5; }
  .dh-change { background: rgba(255,196,0,.30); }
  .dh-del    { background: rgba(240,80,80,.26); }
  .dh-add    { background: rgba(80,200,120,.26); }
  .dh-object { background:none; outline:2px dotted rgba(255,196,0,.85); outline-offset:1px; }
  .dh-gap    { background:none; border-left:3px solid rgba(80,200,120,.95);
               height:14px !important; margin-top:-7px; border-radius:0; }
  .dh-focus  { box-shadow: 0 0 0 2px var(--vscode-focusBorder, #4a9eff); }
  .wb-dark-pages .dh-change { background: rgba(255,196,0,.26); }
  .wb-dark-pages .dh-del    { background: rgba(240,80,80,.24); }
  .wb-dark-pages .dh-add    { background: rgba(80,200,120,.24); }

  /* --- WHAT TO DO WITH THE SELECTION ---
     A small bar pinned above the fragment: copy, cut, paste, delete. It is the
     one overlay besides the brackets and the label chips that TAKES the
     pointer, and it is deliberately quiet — the page is the thing being read,
     so the bar sits at the weight of the panel's own chrome rather than
     competing with the type under it. It brightens on hover, and only the
     destructive action takes a colour. */
  .selact { position:absolute; z-index:9; display:flex; gap:1px; padding:2px;
         border-radius:6px; user-select:none;
         background: var(--vscode-editorWidget-background, #252526);
         border:1px solid var(--vscode-editorWidget-border, var(--vscode-panel-border, #454545));
         box-shadow: 0 2px 8px rgba(0,0,0,.28), 0 0 0 .5px rgba(0,0,0,.12);
         opacity:.92; transition: opacity .12s ease; }
  .selact:hover { opacity:1; }
  .selact button { display:inline-flex; align-items:center; justify-content:center;
         width:24px; height:22px; padding:0; border:none; border-radius:4px;
         background:transparent; cursor:pointer;
         color: var(--vscode-editorWidget-foreground, var(--vscode-foreground, #ccc));
         -webkit-appearance:none; appearance:none; }
  .selact button:hover { background: var(--vscode-toolbar-hoverBackground, rgba(128,128,128,.22)); }
  .selact button:active { transform: translateY(.5px); }
  .selact button:focus-visible { outline:1px solid var(--vscode-focusBorder, #4a9eff); outline-offset:-1px; }
  /* Only the irreversible one is coloured, and only once the pointer is on it:
     a red icon sitting on the page permanently reads as an error. */
  .selact button.danger:hover { color: var(--vscode-errorForeground, #f48771);
         background: color-mix(in srgb, var(--vscode-errorForeground, #f48771) 14%, transparent); }
  .selact svg { display:block; pointer-events:none; }

  /* --- WHERE A DRAGGED SELECTION WOULD LAND ---
     A third meaning needs a third colour: amber is "where you are", red is
     "what is selected", so the landing point is BLUE and nothing else is.
     A block lands between lines and is drawn as a rule; a fragment lands at a
     column and is drawn as a caret. */
  /* THE PAPER'S OWN LINKS. Marked, not decorated: a dashed rule under the
     text says "this goes somewhere" without competing with the reference
     badges or repainting the reader's words. Semi-transparent so a page full
     of \eqref does not turn blue. */
  .pdflink { position:absolute; z-index:5; display:block; cursor:pointer;
             border-bottom:1px dashed rgba(55,148,255,.45);
             border-bottom-color: color-mix(in srgb, var(--vscode-textLink-foreground, #3794ff) 45%, transparent);
             border-radius:1px; }
  .pdflink:hover { background: rgba(55,148,255,.10);
             background: color-mix(in srgb, var(--vscode-textLink-foreground, #3794ff) 10%, transparent);
             border-bottom-style:solid; }
  /* An outward link is a different promise from one inside the paper. */
  .pdflink.ext { border-bottom-color: rgba(180,120,220,.5);
             border-bottom-color: color-mix(in srgb, var(--vscode-charts-purple, #b180d7) 55%, transparent); }
  .wb-dark-pages .pdflink { border-bottom-color: rgba(120,180,255,.5); }

  .movecaret { position:absolute; pointer-events:none; z-index:8;
         background: var(--vscode-focusBorder, #4a9eff);
         box-shadow: 0 0 4px rgba(74,158,255,.9); }
  .movecaret:not(.block) { width:2px; margin-left:-1px; }
  .movecaret.block { height:2px; margin-top:-1px; border-radius:1px; }

  /* A computation badge in the label overlay. It marks the OUTPUT — the only
     visible sign that a figure or an equation has live code behind it, since
     the block itself is a comment and prints nothing. Coloured by state, so a
     stale one is visible at a glance across a page. */
  .lbc-mma { cursor: pointer; font-weight: 600;
             background: var(--vscode-charts-purple, #b180d7); color: #fff; }
  .lbc-mma-stale            { background: var(--vscode-charts-yellow, #d7a418); color: #1e1e1e; }
  .lbc-mma-modified-by-user { background: var(--vscode-charts-orange, #d18616); color: #1e1e1e; }
  .lbc-mma-malformed, .lbc-mma-orphaned { background: var(--vscode-charts-red, #d95f5f); color: #fff; }
  .lbc-mma-ephemeral        { background: var(--vscode-descriptionForeground, #999); color: #1e1e1e; }
  .lbc-mma:hover { outline: 1px solid var(--vscode-focusBorder, #007fd4); }

  /* ---- inserting a Mathematica computation ------------------------------ */
  /* Armed: the whole page is a target, so the cursor says so everywhere. */
  body.arming-insert #pages, body.arming-insert #pages * { cursor: crosshair !important; }
  body.arming-insert #addmma { background: var(--vscode-button-background, #0e639c);
                               color: var(--vscode-button-foreground, #fff); }

  .mmacard { position:absolute; z-index:12; display:flex; flex-direction:column;
             border-radius:6px; overflow:hidden;
             background: var(--vscode-editor-background, #1e1e1e);
             color: var(--vscode-editor-foreground, #ddd);
             border:1px solid var(--vscode-widget-border, rgba(128,128,128,.35));
             box-shadow: 0 6px 22px rgba(0,0,0,.35); }
  .mc-head { display:flex; align-items:center; gap:6px; padding:4px 6px;
             background: var(--vscode-editorWidget-background, #252526);
             border-bottom:1px solid var(--vscode-widget-border, rgba(128,128,128,.3));
             font-size:11px; }
  .mc-title { font-weight:600; }
  .mc-where { color: var(--vscode-descriptionForeground, #999); }
  .mc-spacer { flex:1; }
  .mc-head select { font-size:11px; max-width:150px;
                    background: var(--vscode-dropdown-background, #3c3c3c);
                    color: var(--vscode-dropdown-foreground, #ddd);
                    border:1px solid var(--vscode-dropdown-border, #3c3c3c); border-radius:3px; }
  /* The state badge is the block's own verdict, in the vocabulary the CodeLens
     and the diagnostics already use, so all three agree on the page. */
  /* The width BTL breaks to. Small and quiet — it is a setting, not an
     action — but visible, because a wrong one is invisible in the card and
     obvious only once the equation is on the page. */
  .mc-w { display:inline-flex; align-items:center; gap:2px; font-size:10px;
          color: var(--vscode-descriptionForeground, #999); }
  .mc-width { width:42px; font-size:10px; padding:1px 2px; text-align:right;
          background: var(--vscode-input-background, #3c3c3c);
          color: var(--vscode-input-foreground, #ddd);
          border:1px solid var(--vscode-input-border, transparent); border-radius:3px; }
  .mc-state { font-size:10px; padding:1px 5px; border-radius:8px;
              background: rgba(128,128,128,.18); }
  .mc-state.fresh    { background: rgba(70,160,90,.25); }
  .mc-state.stale    { background: rgba(200,150,40,.28); }
  .mc-state.modified-by-user { background: rgba(200,110,40,.28); }
  .mc-state.malformed, .mc-state.orphaned { background: rgba(200,70,70,.28); }

  .mc-cell { display:flex; flex-direction:column; border-bottom:1px solid
             var(--vscode-widget-border, rgba(128,128,128,.18)); }
  .mc-editor { position:relative; font-family: var(--vscode-editor-font-family, monospace);
               font-size: 12px; line-height:1.45; }
  /* The highlight layer and the textarea hold the SAME characters; the layer
     is the size-driver and the textarea lies transparently on top of it, so
     the caret comes from the textarea and the colour from behind it. */
  .mc-hl, .mc-editor textarea {
      margin:0; padding:6px 8px; border:0; white-space:pre-wrap; word-break:break-word;
      font:inherit; letter-spacing:normal; tab-size:4; }
  .mc-hl { min-height:1.45em; pointer-events:none; }
  .mc-editor textarea { position:absolute; inset:0; width:100%; height:100%;
      resize:none; overflow:hidden; background:transparent; color:transparent;
      caret-color: var(--vscode-editorCursor-foreground, #ddd); outline:none; }
  .mc-editor textarea::selection { background: var(--vscode-editor-selectionBackground, #264f78); }

  .mc-bar { display:flex; align-items:center; gap:6px; padding:3px 6px; font-size:11px;
            background: var(--vscode-editorWidget-background, #252526); }
  .mc-bar label { display:flex; align-items:center; gap:4px;
                  color: var(--vscode-descriptionForeground, #999); }
  .mc-out { padding:6px 8px; font-size:12px; max-height:280px; overflow:auto;
            border-top:1px dashed var(--vscode-widget-border, rgba(128,128,128,.25)); }
  .mc-out.err { color: var(--vscode-errorForeground, #f48771); white-space:pre-wrap; }
  .mc-out img, .mc-out svg { max-width:100%; height:auto; }
  .mc-note { font-size:10px; color: var(--vscode-descriptionForeground, #999); }
  .mc-hint { padding:3px 6px; font-size:10px;
             color: var(--vscode-descriptionForeground, #999);
             background: var(--vscode-editorWidget-background, #252526); }

  /* The tokeniser's colours. The notebook renderer defines these in WL_CSS,
     but this panel does not load WL_CSS — it is a standalone shell — so the
     full set lives here. Palette follows VS Code Dark+, which is what the
     notebook editor shows, so Wolfram code looks the same in both places.
     The distinction that carries the weight is sym (a builtin, e.g. Table)
     against usr (this paper's own symbols); everything else is detail. */
  .wl-hl-str  { color: #ce9178; }
  .wl-hl-cmt  { color: #6a9955; font-style: italic; }
  .wl-hl-num  { color: #b5cea8; }
  .wl-hl-sym  { color: #569cd6; }
  .wl-hl-usr  { color: var(--vscode-editor-foreground, #d4d4d4); }
  .wl-hl-ctx  { color: #b392f0; opacity:.85; }
  .wl-hl-pat  { color: #4ec9b0; font-style: italic; }
  .wl-hl-slot { color: #4ec9b0; font-weight:600; }
  .wl-hl-op   { color: #d16969; }
  .wl-hl-esc  { color: #61afef; font-weight:600; }
  .wl-hl-cmd  { color: #569cd6; }
  .wl-hl-math { color: #d16969; }
  .wl-hl-brk  { color: #808080; }
  /* The whole page says "carrying something" while the hand is down. */
  body.moving-sel #pages, body.moving-sel .selfill { cursor: grabbing; }
  body.moving-sel .selfill { opacity:.55; }

  /* --- THE LABEL OVERLAY (hold Shift) ---
     Every \label beside the thing it names, every \ref and \cite beside the
     label it points at; click to copy the reference.

     A THIRD overlay class, not a reuse of .hl or .dh: paintHighlight wipes
     every .hl on each cursor move, and a reader holding Shift while the cursor
     moves is the ordinary case.

     These are the only overlay that TAKES THE POINTER — everything else here is
     pointer-events:none. The plate behind the text is the editor's own
     background at 78%, which is what keeps a chip legible over both white paper
     and a darkened page: the chip is DOM, so the canvas invert filter that
     darkens the page does not touch it. */
  /* THE BADGE SCALES WITH THE PAGE AND STAYS IN THE MARGIN.
     A fixed 9px pill is enormous beside a page zoomed out and tiny beside one
     zoomed in, and it was placed against its own ink — measured, 87 of 119
     badges sat ON printed words. Now: one column per side, the size tied to
     --lbc-scale (the page's own zoom), and the width capped to the margin with
     the rest of the name elided until hover. */
  /* A SECTION FOLDED OUT OF THE PAPER.
     The fold control appears with the label overlay; the "n lines hidden" pill
     is always there, because a section missing from the paper with nothing to
     say so is worse than one that is simply long. It reads as a control, not
     as type — nobody should mistake it for something the paper prints. */
  /* One cluster per anchor: the fold and the copy tag sit side by side rather
     than on the same spot, and the left margin stays the \ref badges'. */
  /* overflow is VISIBLE so the action strip above the cluster is not clipped
     away by it. The clipping was only ever needed to stop a long tag running
     off the sheet, so it moved onto the tag, which is the thing that grows. */
  .wpa { position:absolute; z-index:7; display:flex; gap:4px; align-items:center;
             transform:translateY(-1px); overflow:visible; }
  .secfold { font-family: var(--vscode-font-family); font-size:9.5px; line-height:1.5;
             padding:0 6px; border-radius:9px; cursor:pointer; white-space:nowrap;
             overflow:hidden; text-overflow:ellipsis; flex:0 1 auto;
             border:1px solid var(--vscode-panel-border, rgba(128,128,128,.5));
             background: var(--vscode-editorWidget-background, #252526);
             color: var(--vscode-descriptionForeground, #999); opacity:.55; }
  .secfold:hover { opacity:1; }
  .secfold.on { opacity:1; font-weight:600;
             color: var(--vscode-editorWarning-foreground, #c90);
             border-color: var(--vscode-editorWarning-foreground, #c90);
             border-style:dashed;
             background: color-mix(in srgb, var(--vscode-editorWarning-foreground, #c90) 12%,
                         var(--vscode-editorWidget-background, #252526)); }
  /* A TAG, and it looks like one: this is a place in the source, not something
     the paper prints. Clicking copies `path:line` — how a reader points an
     agent at a spot without describing it. */
  /* A PAPER TAG. The shape is already a tab — square on the spine, rounded on
     the outer edge — and the colour now matches: manila, the way an index tab
     clipped to a printed page looks. It reads as something ATTACHED to the
     paper rather than as another piece of editor chrome, which is what these
     are: a place you can point at, not a control that does something. Amber
     also stays legible on both a white page and a dark-themed one, which grey
     at 50% opacity did not. */
  .wpatag { font-family: var(--vscode-editor-font-family, monospace); font-size:9px;
             line-height:1.5; padding:0 5px 0 4px; cursor:pointer; white-space:nowrap;
             max-width:100%; overflow:hidden; text-overflow:ellipsis;
             flex:0 0 auto; border-radius:2px 7px 7px 2px;
             border:1px solid #a8791f;
             background: #d8a93a;
             color: #40300c; opacity:.72; }
  .wpatag:hover { opacity:1; border-color: #6b4a0d; background: #e8bd52;
             color: #2a1f06; }
  .wpatag-equation { font-style:normal; }
  /* The three actions on a sectioning anchor. Quiet until the cluster is
     hovered — they sit beside a fold control and a copy tag, and three more
     always-lit buttons would turn a margin into a toolbar. */
  /* A strip of its own, ABOVE the cluster — `bottom:100%` so adding it does
     not move the fold control or the tag by a pixel. It carries a background
     of its own because it sits over the paper, and three bare glyphs at a
     third opacity over printed text is the definition of hard to see. */
  .wpa-acts { position:absolute; bottom:100%; left:0; margin-bottom:3px;
            display:flex; gap:1px; padding:1px 2px; border-radius:4px;
            background: var(--vscode-editorWidget-background, #252526);
            border:1px solid var(--vscode-widget-border, rgba(128,128,128,.4));
            box-shadow: 0 1px 4px rgba(0,0,0,.28); }
  .wpaact { display:inline-flex; align-items:center; justify-content:center;
            width:22px; height:19px; padding:0; border:none;
            border-radius:3px; cursor:pointer; background:transparent;
            color: var(--vscode-foreground, #ccc); opacity:.8; }
  .wpa:hover .wpaact { opacity:1; }
  .wpaact:hover { background: var(--vscode-toolbar-hoverBackground, rgba(128,128,128,.3)); }
  .wpaact[data-anchor-action="delete"]:hover { color: var(--vscode-errorForeground, #f48771);
            background: color-mix(in srgb, var(--vscode-errorForeground, #f48771) 18%, transparent); }
  .lbc { position:absolute; z-index:7; pointer-events:auto; cursor:copy;
         font: 500 calc(7.4px * var(--lbc-scale, 1))/1.3 var(--vscode-font-family);
         white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
         padding:0 calc(2.4px * var(--lbc-scale, 1)); border-radius:2px; letter-spacing:.01em;
         color: var(--vscode-textLink-foreground, #3794ff);
         background: rgba(255,255,255,.78);
         background: color-mix(in srgb, var(--vscode-editor-background, #fff) 78%, transparent);
         border:1px solid rgba(55,148,255,.45);
         border-color: color-mix(in srgb, var(--vscode-textLink-foreground, #3794ff) 45%, transparent);
         box-shadow: 0 1px 2px rgba(0,0,0,.18); }
  /* A 9px pill is a small target; the grip is bigger than the mark, exactly as
     a selection bracket's is. */
  .lbc::after { content:''; position:absolute; inset:-4px; }
  /* Hovered: the whole name, over everything, out of the column if it must. */
  .lbc:hover { background: var(--vscode-textLink-foreground, #3794ff);
         color: var(--vscode-editor-background, #fff);
         max-width:none !important; z-index:20; overflow:visible; }
  /* Placed against the object rather than its own ink — say so rather than
     imply a precision we do not have. */
  .lbc-approx { border-style:dashed; opacity:.82; }
  /* A LABEL AND A REFERENCE ARE OPPOSITE CLAIMS, so they are opposite badges.
     A declaration names the thing it sits on, so it is SOLID — it belongs to
     the block. A reference points somewhere else, so it is an OUTLINE with an
     arrow: lighter, obviously secondary, and never mistakable for the thing's
     own name. */
  .lbc-decl { font-weight:600;
         color: var(--vscode-editor-background, #fff);
         background: var(--vscode-textLink-foreground, #3794ff);
         border-color: transparent; }
  .lbc-decl:hover { background: var(--vscode-textLink-activeForeground, #4daafc); }
  .lbc-ref { font-weight:400; font-style:normal;
         background: color-mix(in srgb, var(--vscode-editor-background, #fff) 86%, transparent); }
  .lbc-cite { color: var(--vscode-charts-purple, #c586c0);
         border-color: color-mix(in srgb, var(--vscode-charts-purple, #c586c0) 45%, transparent); }
  .lbc-cite:hover { background: var(--vscode-charts-purple, #c586c0);
         color: var(--vscode-editor-background, #fff); }

  /* WHAT A BADGE POINTS AT, RENDERED. No source here: the editor's hover is
     where the LaTeX belongs; on the page the reader wants the paper's own
     answer. White always — it is a piece of the printed page, and a dark plate
     under a white crop would frame it wrongly. */
  .lbcprev { position:absolute; z-index:12; pointer-events:none;
         padding:4px; border-radius:5px; background:#fff;
         border:1px solid var(--vscode-editorWidget-border, rgba(0,0,0,.25));
         box-shadow: 0 4px 14px rgba(0,0,0,.34); }
  .lbcprev img { display:block; max-width:320px; height:auto; border-radius:2px; }
  /* A \ref to a label that does not exist. The editor already says so with a
     squiggle; the page should not quietly draw it as though it resolved. */
  /* The reference itself, underlined where it prints: the badge names it in the
     margin, this says WHICH printed number the name belongs to. */
  .lbcink { position:absolute; z-index:6; pointer-events:none; border-radius:1px;
         border-bottom:1.5px solid var(--vscode-textLink-foreground, #3794ff);
         opacity:.75; }
  .lbcink.cite { border-bottom-color: var(--vscode-charts-purple, #c586c0); }
  .lbc-broken { color: var(--vscode-errorForeground, #f48771);
         border-color: color-mix(in srgb, var(--vscode-errorForeground, #f48771) 55%, transparent);
         text-decoration: line-through; }
  .lbc-copied { background: var(--vscode-charts-green, #89d185);
         color: var(--vscode-editor-background, #fff); border-color:transparent; }
  #labels[aria-pressed="true"] { background: var(--vscode-badge-background);
         color: var(--vscode-badge-foreground); }

  #diffbar { display:none; align-items:center; gap:8px; padding:4px 10px;
             background: var(--vscode-editorWidget-background, transparent);
             border-bottom:1px solid var(--vscode-panel-border); flex:0 0 auto;
             white-space:nowrap; overflow:hidden; }
  #diffbar button { background:transparent; border:none; color:inherit;
             cursor:pointer; border-radius:3px; height:22px; min-width:24px; padding:0 7px; }
  #diffbar button:hover { background: var(--vscode-toolbar-hoverBackground, rgba(128,128,128,.18)); }
  #diffwhat { font-weight:600; }
  #diffcount { font-variant-numeric: tabular-nums; opacity:.85; min-width:44px; text-align:center; }
  #diffcensus { opacity:.7; overflow:hidden; text-overflow:ellipsis; }
  #diffclose { margin-left:auto; }
  /* --- the review drawer: what the agent changed, waiting for a verdict --- */
  /* --- the tour: a card in the corner, never a modal ------------------------
     It sits over the page's own margin, small enough to leave the paper
     readable, because every step asks the reader to DO something on that very
     page. A modal would cover the thing it is talking about. */
  #tour { position:fixed; left:14px; bottom:34px; width:262px; z-index:60;
          background: var(--vscode-editorWidget-background, #252526);
          color: var(--vscode-editorWidget-foreground, inherit);
          border:1px solid var(--vscode-focusBorder, #0a84ff);
          border-radius:7px; padding:10px 11px 11px; font-size:12px; line-height:1.45;
          box-shadow:0 6px 22px rgba(0,0,0,.34); }
  #tour[hidden] { display:none; }
  #tour .th { display:flex; align-items:center; gap:6px; margin-bottom:5px;
          font-size:10px; letter-spacing:.06em; text-transform:uppercase; opacity:.62; }
  #tour .th .sp { flex:1; }
  #tour .th button { background:transparent; border:0; color:inherit; opacity:.75;
          cursor:pointer; font-size:12px; line-height:1; padding:2px 4px; border-radius:3px; }
  #tour .th button:hover { opacity:1; background: var(--vscode-toolbar-hoverBackground, rgba(128,128,128,.2)); }
  #tour .tt { font-weight:600; font-size:12.5px; margin-bottom:3px; }
  #tour .ts { opacity:.82; }
  #tour .td { margin-top:8px; padding:5px 7px; border-radius:4px;
          background: var(--vscode-textBlockQuote-background, rgba(128,128,128,.13));
          border-left:2px solid var(--vscode-focusBorder, #0a84ff); }
  #tour .td:empty { display:none; }
  #tour .tdone { margin-top:9px; }
  #tour .tdone button { background: var(--vscode-button-background, #0a63c9);
          color: var(--vscode-button-foreground, #fff); border:0; border-radius:3px;
          height:22px; padding:0 12px; cursor:pointer; font-size:11.5px; }
  #tour .bar { display:block; margin-top:9px; height:2px; border-radius:2px;
          background: var(--vscode-panel-border, rgba(128,128,128,.35)); overflow:hidden; }
  #tour .bar i { display:block; height:100%; background: var(--vscode-focusBorder, #0a84ff);
          transition: width .25s ease; }
  /* The ring points at a control the step names; it never intercepts a press. */
  #tourring { position:fixed; z-index:59; pointer-events:none; border-radius:6px;
          border:2px solid var(--vscode-focusBorder, #0a84ff); animation: tourpulse 1.6s ease-in-out infinite; }
  #tourring[hidden] { display:none; }
  @keyframes tourpulse { 0%,100% { opacity:.95; } 50% { opacity:.35; } }
  @media (prefers-reduced-motion: reduce) { #tourring { animation:none; } #tour .bar i { transition:none; } }
  #reviewbar { display:none; align-items:center; gap:8px; padding:4px 10px;
             background: var(--vscode-editorWidget-background, transparent);
             border-bottom:1px solid var(--vscode-panel-border); flex:0 0 auto;
             white-space:nowrap; overflow:hidden; }
  body.reviewing #reviewbar { display:flex; }
  #reviewbar .t { font-weight:600; }
  #reviewbar .census { opacity:.7; overflow:hidden; text-overflow:ellipsis; }
  #reviewbar .sp { flex:1; }
  #reviewbar button { background:transparent; border:1px solid var(--vscode-panel-border);
             color:inherit; cursor:pointer; border-radius:3px; height:22px; padding:0 8px; }
  #reviewbar button:hover { background: var(--vscode-toolbar-hoverBackground, rgba(128,128,128,.18)); }
  #reviewbar button.keep { color: var(--vscode-gitDecoration-addedResourceForeground, #4a8); }
  #reviewbar button.undo { color: var(--vscode-gitDecoration-deletedResourceForeground, #c66); }
  /* THE LIST SITS UNDER THE PAPER, NOT OVER IT.
     A drawer down the right-hand side covered a third of the page — including
     the margin the label badges live in — and a page does not reflow to make
     room. At the bottom it PUSHES the pages instead of hiding them: the paper
     keeps its full width, which is the dimension a reader cannot get back by
     scrolling. It grows with its content up to a third of the panel. */
  #reviewpanel { display:none; position:relative; flex:0 0 auto; height:30vh;
             min-height:90px; max-height:75vh; text-align:left;
             background: var(--vscode-editorWidget-background, var(--vscode-editor-background));
             border-top:1px solid var(--vscode-panel-border); }
  body.reviewing #reviewpanel { display:flex; }
  /* A BOTTOM PANEL RESIZES FROM ITS TOP EDGE, which is why the browser's own
     grip (bottom-right) is no use here: dragging the bottom of something
     anchored to the bottom moves nothing a reader can see. */
  #rpgrip { position:absolute; left:0; right:0; top:-3px; height:7px; cursor:ns-resize;
            z-index:12; }
  #rpgrip:hover, body.rp-sizing #rpgrip {
            background: var(--vscode-sash-hoverBorder, rgba(55,148,255,.5)); }
  body.rp-sizing { cursor:ns-resize; user-select:none; }
  /* Two halves: what changed, and — for the one you are looking at — the change
     itself. A list of names answers "what did it touch"; only the LaTeX answers
     "should I keep it", and going to the editor to find out is the trip this
     panel exists to save. */
  #reviewlist { flex:0 0 46%; max-width:46%; overflow:auto; container-type:inline-size;
             border-right:1px solid var(--vscode-panel-border); }
  #reviewdiff { flex:1; overflow:auto; padding:8px 12px;
             font-family: var(--vscode-editor-font-family, monospace);
             font-size: calc(var(--vscode-editor-font-size, 12px) * .92); line-height:1.45; }
  /* THE VERDICTS TRAVEL WITH THE CHANGE. A 191-line addition scrolls the head
     off the top, so it sticks — buttons you have to scroll back up to find are
     the reported problem in a different place. */
  #reviewdiff .rd-head { position:sticky; top:-8px; z-index:2;
             background: var(--vscode-editorWidget-background, var(--vscode-editor-background, #1e1e1e));
             margin:-8px -12px 6px; padding:8px 12px 6px;
             display:flex; align-items:center; gap:8px;
             font-family: var(--vscode-font-family); font-size:11px;
             opacity:.7; margin-bottom:6px; display:flex; gap:8px; align-items:center; }
  #reviewdiff .rd-head .sp { flex:1; }
  #reviewdiff .rd-acts { display:flex; gap:4px; flex:0 0 auto; }
  #reviewdiff .rd-acts button { background:transparent; border:1px solid var(--vscode-panel-border);
             color:inherit; cursor:pointer; border-radius:3px; height:21px; padding:0 9px; font-size:11px; }
  #reviewdiff .rd-acts button:hover:not(:disabled) { background: var(--vscode-toolbar-hoverBackground, rgba(128,128,128,.18)); }
  #reviewdiff .rd-acts button:disabled { opacity:.4; cursor:default; }
  #reviewdiff .rd-acts button.keep { color: var(--vscode-gitDecoration-addedResourceForeground, #4a8); }
  #reviewdiff .rd-acts button.undo { color: var(--vscode-gitDecoration-deletedResourceForeground, #c66); }
  #reviewdiff .rd-flag { font-size:10.5px; color: var(--vscode-editorWarning-foreground, #c90); white-space:nowrap; }
  #reviewdiff .rd-none { font-family: var(--vscode-font-family); font-size:12px; opacity:.6; }
  #reviewdiff .rd-line { white-space:pre-wrap; word-break:break-word; padding:0 6px;
             border-left:2px solid transparent; }
  #reviewdiff .rd-line.was { background: var(--vscode-diffEditor-removedTextBackground, rgba(200,90,70,.18));
             border-left-color: var(--vscode-gitDecoration-deletedResourceForeground, #c66); }
  #reviewdiff .rd-line.now { background: var(--vscode-diffEditor-insertedTextBackground, rgba(80,180,120,.18));
             border-left-color: var(--vscode-gitDecoration-addedResourceForeground, #4a8); }
  #reviewdiff .rd-sep { height:6px; }
  #reviewdiff .rd-tag { font-family: var(--vscode-font-family); font-size:10px; opacity:.65;
             letter-spacing:.06em; text-transform:uppercase; margin:2px 0; }
  #reviewdiff mark { background: color-mix(in srgb, var(--vscode-editor-foreground, #ccc) 22%, transparent);
             color:inherit; border-radius:2px; padding:0 1px; }
  #reviewdiff .was mark { background: color-mix(in srgb, var(--vscode-gitDecoration-deletedResourceForeground, #c66) 38%, transparent); }
  #reviewdiff .now mark { background: color-mix(in srgb, var(--vscode-gitDecoration-addedResourceForeground, #4a8) 38%, transparent); }
  #reviewpanel .grp { position:sticky; top:0; z-index:1; padding:5px 12px; font-size:11px;
             opacity:.85; display:flex; gap:8px; align-items:center;
             background: var(--vscode-editorWidget-background, var(--vscode-editor-background));
             border-bottom:1px solid var(--vscode-panel-border); }
  #reviewpanel .grp .sp { flex:1; }
  #reviewpanel .grp button { background:transparent; border:1px solid var(--vscode-panel-border);
             color:inherit; cursor:pointer; border-radius:3px; font-size:11px; padding:1px 6px; }
  /* A wide, short panel wants columns, not a stack: verb, name, what happened,
     where it is, and the two verdicts — each in its own place, so the eye runs
     down one column instead of parsing a paragraph per row. */
  /* THE VERDICTS ARE THE LAST COLUMN, AND THEY WERE BEING CLIPPED. With the
     diff pane taking half the panel the row no longer fitted its minimums, so
     Keep and Undo sat outside the visible width — reported as "hard to find".
     The two text columns give way first, and below the width where even that
     is not enough the least load-bearing one is dropped. */
  /* A SECTION HEADING IN THE LIST is the paper's own structure, so it reads as
     a heading — not as the timestamp line an arrival group is. */
  .grp.sec { font-family: var(--vscode-font-family); }
  .grp.sec .secname { font-weight:600; overflow:hidden; text-overflow:ellipsis;
             white-space:nowrap; max-width:60%; }
  .grp.sec .secn { opacity:.6; font-size:10.5px; }
  #reviewbar #reviewgroup[aria-pressed="true"] { border-color: var(--vscode-focusBorder, #0a84ff); }
  .rh { display:grid; grid-template-columns:14px minmax(70px, 26%) minmax(60px, 1fr) auto auto;
             gap:10px; align-items:baseline; padding:5px 12px; cursor:pointer;
             border-bottom:1px solid rgba(128,128,128,.10); }
  .rh:hover { background: var(--vscode-list-hoverBackground, rgba(128,128,128,.12)); }
  .rh.on { background: var(--vscode-list-activeSelectionBackground, rgba(90,140,220,.22)); }
  .rh .v { font-weight:700; text-align:center; }
  .rh .v.add { color: var(--vscode-gitDecoration-addedResourceForeground, #4a8); }
  .rh .v.del { color: var(--vscode-gitDecoration-deletedResourceForeground, #c66); }
  .rh .v.change { color: var(--vscode-gitDecoration-modifiedResourceForeground, #d90); }
  .rh .name { font-family: var(--vscode-editor-font-family, monospace); font-size:11.5px;
             overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rh .meta { font-size:11px; opacity:.7; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rh .where { font-size:11px; opacity:.55; white-space:nowrap; }
  .rh .acts { display:flex; gap:4px; }
  .rh .acts button { background:transparent; border:1px solid var(--vscode-panel-border);
             color:inherit; cursor:pointer; border-radius:3px; font-size:11px; padding:1px 6px; }
  .rh .acts button.keep { color: var(--vscode-gitDecoration-addedResourceForeground, #4a8); }
  .rh .acts button.undo { color: var(--vscode-gitDecoration-deletedResourceForeground, #c66); }
  .rh .flag { font-size:10.5px; color: var(--vscode-editorWarning-foreground, #c90); white-space:nowrap;
             overflow:hidden; text-overflow:ellipsis; }
  @container (max-width: 470px) { .rh .where { display:none; } }
  @container (max-width: 380px) { .rh .meta { display:none; } }
  #reviewpanel .done { padding:6px 12px; font-size:10.5px; opacity:.6;
             border-top:1px solid var(--vscode-panel-border); }

  /* --- contextual paper comments --------------------------------------- */
  #commentstool { position:relative; display:inline-flex; align-items:center; }
  #commentsbutton { gap:4px; }
  #commentsmenu { display:none; min-width:20px; width:20px; padding:0 3px;
             margin-left:-1px; border-left:1px solid color-mix(in srgb,
             var(--vscode-textLink-foreground, #3794ff) 28%, transparent);
             border-radius:0 4px 4px 0; }
  #commentsmenu .tool-icon { width:11px; height:11px; }
  body.comments-open #commentsmenu { display:inline-flex;
             color:var(--vscode-textLink-activeForeground,
             var(--vscode-textLink-foreground, #3794ff));
             background:color-mix(in srgb, var(--vscode-textLink-foreground, #3794ff) 17%, transparent);
             box-shadow:inset 0 0 0 1px color-mix(in srgb,
             var(--vscode-textLink-foreground, #3794ff) 42%, transparent); }
  #commentscount { display:inline-flex; min-width:15px; height:15px; padding:0 4px;
             align-items:center; justify-content:center; box-sizing:border-box;
             border-radius:8px; font-size:9.5px; font-variant-numeric:tabular-nums;
             background:var(--vscode-badge-background, #4d4d4d);
             color:var(--vscode-badge-foreground, #fff); }
  #commentscount[hidden] { display:none; }
  #commentsbutton[aria-pressed="true"] {
             color:var(--vscode-textLink-activeForeground,
             var(--vscode-textLink-foreground, #3794ff));
             background:color-mix(in srgb, var(--vscode-textLink-foreground, #3794ff) 17%, transparent);
             box-shadow:inset 0 0 0 1px color-mix(in srgb,
             var(--vscode-textLink-foreground, #3794ff) 42%, transparent); }
  body.comments-open #commentsbutton { border-radius:4px 0 0 4px; }
  #commentsbutton[aria-pressed="true"] #commentscount {
             background:var(--vscode-textLink-foreground, #3794ff); color:#fff; }
  #commentsdropdown { position:fixed; z-index:80; width:min(330px, calc(100vw - 20px));
             max-height:min(360px, calc(100vh - 58px)); overflow:auto; padding:5px;
             border:1px solid var(--vscode-menu-border, var(--vscode-panel-border));

     the status text and the page count, so a narrow panel silently lost the
     two things that were telling the reader where they are.

          their size instead of being sheared off;
       2. `narrow` drops the words from the controls that have an icon or a

          "follow: scroll" still says scroll;
