# wolfbook / .github/workflows/release.yml
#
# Downloads pre-built wstp.node binaries from the latest release of
# vanbaalon/mathematica-wstp-node, then packages platform-specific VSIXs
# and creates a Wolfbook GitHub Release.
#
# No Wolfram Engine or self-hosted runner required — runs on ubuntu-latest.
#
# Triggers:
#   - Push of a version tag:  git tag v2.x.x && git push --tags
#   - Manual:                 GitHub Actions → "Run workflow"

name: Package & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      wstp_tag:
        description: 'wstp-node release tag to pull binaries from (e.g. v0.4.0; default: latest)'
        required: false
        default: 'latest'

jobs:
  package:
    name: Package VSIXs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - uses: actions/setup-node@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          node-version: '24'

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Install extension dependencies
        run: npm ci

      # ── Download wstp binaries from mathematica-wstp-node ───────────────
      - name: Download wstp binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WSTP_TAG: ${{ inputs.wstp_tag || 'latest' }}
        run: |
          mkdir -p wstp/prebuilt
          if [ "$WSTP_TAG" = "latest" ]; then
            FLAG="--repo vanbaalon/mathematica-wstp-node --latest"
          else
            FLAG="--repo vanbaalon/mathematica-wstp-node --tag $WSTP_TAG"
          fi
          gh release download $FLAG --pattern "wstp-darwin-arm64.node" --dir wstp/prebuilt/
          gh release download $FLAG --pattern "wstp-win32-x64.node"    --dir wstp/prebuilt/
          echo "Downloaded:"
          ls -lh wstp/prebuilt/

      # ── Package platform VSIXs ───────────────────────────────────────────
      - name: Get version
        id: ver
        run: echo "version=$(node -p \"require('./package.json').version\")" >> $GITHUB_OUTPUT

      - name: Package darwin-arm64
        run: |
          vsce package --target darwin-arm64 --allow-missing-repository \
            -o "wolfbook-${{ steps.ver.outputs.version }}-darwin-arm64.vsix"

      - name: Package win32-x64
        run: |
          vsce package --target win32-x64 --allow-missing-repository \
            -o "wolfbook-${{ steps.ver.outputs.version }}-win32-x64.vsix"

      # ── Create GitHub Release ────────────────────────────────────────────
      - name: Determine tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo "tag=v${{ steps.ver.outputs.version }}" >> $GITHUB_OUTPUT
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Wolfbook ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            wolfbook-${{ steps.ver.outputs.version }}-darwin-arm64.vsix
            wolfbook-${{ steps.ver.outputs.version }}-win32-x64.vsix
